name: Daily digest

on:
  schedule:
    # 00:37 UTC = 06:07 IST.
    # Deliberately not on the hour or half hour: the shared runner fleet is
    # congested at round times and scheduled jobs queue behind everything else.
    - cron: "37 0 * * *"

  # Lets you trigger a run manually from the Actions tab, which is the only
  # sane way to test a change without waiting until tomorrow morning.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no briefings, no writes)"
        type: boolean
        default: false

permissions:
  contents: write   # needed for the keepalive commit below

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        id: generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          LLM_DEFAULT_PROVIDER: ${{ vars.LLM_DEFAULT_PROVIDER }}
          LLM_CLASSIFY_PROVIDER: ${{ vars.LLM_CLASSIFY_PROVIDER }}
          LLM_BRIEF_PROVIDER: ${{ vars.LLM_BRIEF_PROVIDER }}

          MIMO_PROTOCOL: ${{ vars.MIMO_PROTOCOL }}
          MIMO_BASE_URL: ${{ vars.MIMO_BASE_URL }}
          MIMO_MODEL: ${{ vars.MIMO_MODEL }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

          DEEPSEEK_PROTOCOL: ${{ vars.DEEPSEEK_PROTOCOL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run --verbose
          else
            python main.py --verbose --markdown digest.md
          fi

      # Keeps a readable copy of each digest for 30 days, so you can review
      # output quality without opening the database.
      - name: Upload digest
        if: success() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: digest.md
          retention-days: 30
          if-no-files-found: ignore

      # GitHub disables scheduled workflows in public repos after 60 days
      # with no repository activity, and ONLY new commits reset that timer.
      # Without this the pipeline silently stops the first time you go two
      # months without pushing. One commit a week is enough.
      - name: Keepalive commit
        if: success() && inputs.dry_run != true
        run: |
          if [ "$(date +%u)" != "1" ]; then
            echo "Not Monday, skipping keepalive."
            exit 0
          fi
          mkdir -p .github/runlog
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_number }} ok" \
            >> .github/runlog/history.txt
          # Keep the file from growing forever.
          tail -n 200 .github/runlog/history.txt > .github/runlog/history.tmp
          mv .github/runlog/history.tmp .github/runlog/history.txt
          git config user.name  "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/runlog/history.txt
          git diff --staged --quiet || git commit -m "chore: keepalive [skip ci]"
          git push

      # Without this a 6 AM failure is invisible until you notice a missing
      # digest days later. Opens one issue, reuses it on repeat failures.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily digest failed';
            const body = [
              `Run [${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed.`,
              '',
              `Date: ${new Date().toISOString()}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['pipeline-failure'],
              });
            }
